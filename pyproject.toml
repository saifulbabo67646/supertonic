[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supertonic-server"
dynamic = ["version"]
description = "Self-hosted, OpenAI-compatible Supertonic 3 text-to-speech server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Supertonic Server contributors" }]
requires-python = ">=3.11"
keywords = [
  "tts",
  "text-to-speech",
  "speech-synthesis",
  "supertonic",
  "openai-compatible",
  "fastapi",
  "onnx",
  "websocket",
  "mcp",
  "voice-cloning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "supertonic==1.3.1",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "numpy",
  "soxr",
  "imageio-ffmpeg",
  "mcp>=2,<3",
  "httpx",
  "python-multipart",
]

[project.optional-dependencies]
# Local voice building (CUDA GPU recommended). Only the builder worker process imports these.
builder = [
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchvision==0.24.1", # onnx2torch needs it; pinned so it comes from the same CUDA index
  "onnx",
  "onnx2torch",
  "onnxslim",
  "librosa",
  "scipy",
  "soundfile",
  "transformers",
  "speechbrain",
]

[project.urls]
Homepage = "https://github.com/saifulbabo67646/supertonic"
Repository = "https://github.com/saifulbabo67646/supertonic"
Issues = "https://github.com/saifulbabo67646/supertonic/issues"
Documentation = "https://github.com/saifulbabo67646/supertonic/tree/main/docs"
Changelog = "https://github.com/saifulbabo67646/supertonic/blob/main/CHANGELOG.md"

[project.scripts]
supertonic-server = "supertonic_server.cli:main"
supertonic-mcp = "supertonic_server.mcp.server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pre-commit", "openai", "httpx"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.version]
path = "src/supertonic_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/supertonic_server"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/superpowers", "/.superpowers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not model and not gpu'"
markers = [
  "model: needs real Supertonic weights",
  "gpu: needs a CUDA GPU, the builder extra and real weights",
]
filterwarnings = [
  # onnx2torch's Slice converter indexes with a list (torch deprecation); it still works
  # on the pinned torch 2.9.1 and is outside this project.
  "ignore:Using a non-tuple sequence for multidimensional indexing is deprecated:UserWarning:onnx2torch",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["supertonic", "supertonic.*", "soxr", "imageio_ffmpeg"]
ignore_missing_imports = true

# Builder-only dependencies: untyped, and absent unless the `builder` extra is installed.
[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "torchaudio",
  "torchaudio.*",
  "onnx",
  "onnx.*",
  "onnx2torch",
  "onnx2torch.*",
  "onnxslim",
  "librosa",
  "librosa.*",
  "scipy",
  "scipy.*",
  "soundfile",
  "transformers",
  "transformers.*",
  "speechbrain",
  "speechbrain.*",
]
ignore_missing_imports = true

# The extractors are numeric code over torch, which is `Any` when the extra is not
# installed (CI) and typed when it is: allow Any to flow and keep both setups clean.
[[tool.mypy.overrides]]
module = [
  "supertonic_server.builder.extract.accurate.*",
  "supertonic_server.builder.extract.common.*",
  "supertonic_server.builder.extract.fast.*",
]
warn_return_any = false
disallow_subclassing_any = false
disallow_any_generics = false
warn_unused_ignores = false
