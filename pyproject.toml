[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supertonic-server"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible Supertonic 3 text-to-speech server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "supertonic==1.3.1",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "numpy",
  "soxr",
  "imageio-ffmpeg",
  "mcp>=2,<3",
  "httpx",
  "python-multipart",
]

[project.scripts]
supertonic-server = "supertonic_server.cli:main"
supertonic-mcp = "supertonic_server.mcp.server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pre-commit", "openai", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/supertonic_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = ["model: needs real Supertonic weights"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["supertonic", "supertonic.*", "soxr", "imageio_ffmpeg"]
ignore_missing_imports = true
