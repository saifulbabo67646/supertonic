name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run mypy
      - run: uv run pytest

  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - name: Check the wheel ships the web UI and py.typed
        shell: bash
        run: |
          files=$(unzip -l dist/*.whl)
          for f in supertonic_server/py.typed supertonic_server/web/index.html supertonic_server/web/js/app.js; do
            grep -q "$f" <<<"$files" || { echo "missing from wheel: $f"; exit 1; }
          done
