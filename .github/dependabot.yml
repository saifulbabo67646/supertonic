version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    # Pinned together from the PyTorch CUDA 12.6 index; bump all three by hand.
    ignore:
      - dependency-name: torch
      - dependency-name: torchaudio
      - dependency-name: torchvision
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
