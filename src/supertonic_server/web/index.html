<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Supertonic Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233050d8'/%3E%3Cpath d='M5 16c3-9 5-9 7 0s4 9 7 0 5-9 8 0' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/css/controls.css" />
    <link rel="stylesheet" href="/css/screens.css" />
    <link rel="stylesheet" href="/css/new-voice.css" />
    <link rel="stylesheet" href="/css/guide.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
      <a class="brand" href="#/speak" aria-label="Supertonic Studio, go to Speak">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 16c3-9 5-9 7 0s4 9 7 0 5-9 8 0 3 4 4 4" />
        </svg>
        <span class="brand-name">Supertonic</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/speak" data-route="speak">Speak</a>
        <a href="#/voices" data-route="voices">Voices</a>
        <a href="#/connect" data-route="connect">Connect</a>
      </nav>
      <div class="mast-side">
        <p class="server-status" id="server-status" aria-live="polite">Connecting…</p>
        <a
          class="help-link"
          href="https://github.com/saifulbabo67646/supertonic/blob/main/docs/getting-started.md"
          target="_blank"
          rel="noopener"
          >Help<span class="visually-hidden"> (beginner's guide, opens in a new tab)</span></a
        >
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="view-speak" class="view" aria-labelledby="speak-title" hidden></section>
      <section id="view-voices" class="view" aria-labelledby="voices-title" hidden></section>
      <section id="view-new-voice" class="view" aria-labelledby="new-voice-title" hidden></section>
      <section id="view-connect" class="view" aria-labelledby="connect-title" hidden></section>
      <noscript><p class="notice">Supertonic Studio needs JavaScript. Turn it on in your browser settings and reload this page.</p></noscript>
    </main>

    <dialog id="key-dialog" aria-labelledby="key-dialog-title">
      <form method="dialog" class="key-form">
        <h2 id="key-dialog-title">Access key needed</h2>
        <p>
          This Supertonic server is protected with an access key (also called an API key), like a
          password. Ask the person who set it up for the key. It is saved in this browser only.
        </p>
        <label for="key-input">Access key</label>
        <input id="key-input" name="key" type="password" autocomplete="off" spellcheck="false" required />
        <p class="field-error" id="key-error" role="alert"></p>
        <div class="row end">
          <button type="button" class="btn ghost" value="cancel" id="key-cancel">Cancel</button>
          <button type="submit" class="btn primary" value="save">Save key</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
